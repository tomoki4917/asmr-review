# 毎日 日本時間 21:05 と 22:00 に本番向けビルドを走らせる（goLiveAt 通過後の反映用）。
#
# 【静的サイトの前提】`output: "export"` では `goLiveAt` はビルド実行時刻と比較される。
# 予約時刻のあとに **本番ビルドが一度走る**必要がある（サーバの予約投稿ではない）。
#
# --- デプロイの二通り（どちらか一方があればよい。CLI を推奨）---
# A) **推奨: Vercel CLI** … Secrets に `VERCEL_TOKEN` + `VERCEL_ORG_ID` + `VERCEL_PROJECT_ID` を入れる。
#    Deploy Hook より確実に Deployments に行が付きやすい。値の取り方は `src/content/README.md` の該当節。
# B) **Deploy Hook** … `VERCEL_DEPLOY_HOOK_URL` のみ。`https://api.vercel.com/v1/integrations/deploy/...` 全文。
#
# --- 動かないとき ---
# 1. 上記 A または B が default branch の Secrets に入っているか。
# 2. Actions が無効・リポジトリ長期無操作で schedule 停止、など。
# 3. Vercel のチーム／プロジェクトを取り違えていないか。
#
# 手動テスト: Actions → Schedule Vercel deploy → Run workflow

name: Schedule Vercel deploy

on:
  schedule:
    - cron: "5 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Log runner time (debug)
        run: |
          echo "Runner UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Runner JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"

      - name: Production deploy on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Using Vercel CLI (VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID)…"
            export VERCEL_ORG_ID
            export VERCEL_PROJECT_ID
            npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --cwd "$GITHUB_WORKSPACE"
            echo "OK: Vercel CLI deploy finished. Check Vercel → Deployments for this project."
            exit 0
          fi

          echo "CLI 用シークレットが揃っていないため Deploy Hook を試します…"

          if [ -z "${HOOK_URL:-}" ]; then
            echo "::error::Vercel へのデプロイ方法が未設定です。次の **どちらか** を GitHub → Settings → Secrets → Actions に設定してください。"
            echo "::error::(A 推奨) VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID … 手順はリポジトリの src/content/README.md を参照。"
            echo "::error::(B) VERCEL_DEPLOY_HOOK_URL … Vercel → Project → Settings → Git → Deploy Hooks の Production 用 URL 全文。"
            exit 1
          fi

          case "$HOOK_URL" in
            *api.vercel.com*) ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK_URL は https://api.vercel.com/v1/integrations/deploy/... 形式である必要があります。"
              exit 1
              ;;
          esac

          echo "POST to deploy hook (URL はログに出しません)…"
          http_code=$(curl -sS -L -o /tmp/vercel_hook_body.txt -w "%{http_code}" -X POST "$HOOK_URL") || exit $?
          echo "Deploy hook HTTP status: ${http_code}"
          head -c 400 /tmp/vercel_hook_body.txt | tr '\r\n' ' '
          echo ""
          case "$http_code" in
            200|201|202) ;;
            *)
              echo "::error::Deploy hook が想定外の HTTP を返しました (${http_code})。フックを作り直すか、(A) の CLI 方式に切り替えてください。"
              exit 1
              ;;
          esac
          echo "OK: deploy hook を受け付けました。Deployments に行が付くか確認してください。"
