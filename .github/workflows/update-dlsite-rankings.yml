# DLsite ランキング同期（週1・価格更新の直後付近）
#
# cron は UTC 基準。例: `12 18 * * 6` = 毎週土曜 18:12 UTC
#   → 日本時間 日曜 03:12（価格更新 `37 17 * * 6` のあと）
# 分を 12 にしているのは「ちょうど 0 分開始」を避けるため。
#
# 手動実行: Actions タブ → 本ワークフロー → Run workflow

name: Update DLsite rankings

on:
  schedule:
    - cron: "12 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch rankings and write data/dlsite-rankings.json
        run: npm run update-dlsite-rankings

      - name: Commit and push if dlsite-rankings.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dlsite-rankings.json
          if git diff --cached --quiet; then
            echo "No changes to data/dlsite-rankings.json — skipping commit."
            exit 0
          fi
          git commit -m "chore: update DLsite rankings [automated]"
          git push

      - name: Upload dlsite-rankings.json (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dlsite-rankings-json
          path: data/dlsite-rankings.json
