# DLsite 価格同期（週1・日本時間の深夜〜早朝に近い UTC で起動）
#
# cron は UTC 基準。例: `37 17 * * 6` = 毎週土曜 17:37 UTC
#   → 日本時間 日曜 02:37（トラフィックが比較的少ない時間帯の目安）
# 分を 37 にしているのは「ちょうど 0 分開始」を避けるため。
#
# 手動実行: Actions タブ → 本ワークフロー → Run workflow

name: Update DLsite prices

on:
  schedule:
    - cron: "37 17 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 起動ジッターはスクリプト内のみ（0〜DL_PRICE_START_JITTER_MAX_SEC 秒）。
      # スケジュールは分を 37 にして「ちょうど 0 分起動」を避けています。
      - name: Fetch prices and write data/products.json
        env:
          DL_PRICE_START_JITTER_MAX_SEC: "600"
        run: npm run update-prices

      - name: Upload products.json (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: products-json
          path: data/products.json
