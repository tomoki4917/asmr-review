# セール終了後も JSON 上がセール中のままの行だけ再取得（日2回）
#
# 条件: on_sale===true かつ sale_end_iso が現在時刻より前
# GitHub の schedule は UTC。日本は DST なし（UTC+9）
#   - `1 15 * * *` → 毎日 JST 00:01（例: 2026-04-20 15:01 UTC = 2026-04-21 00:01 JST）
#   - `1 5 * * *` → 毎日 JST 14:01（例: 2026-04-21 05:01 UTC = 2026-04-21 14:01 JST）
#
# 手動実行: Actions → Update DLsite prices (stale sale ended) → Run workflow

name: Update DLsite prices (stale sale ended)

on:
  schedule:
    - cron: "1 15 * * *" # 毎日 00:01 JST
    - cron: "1 5 * * *" # 毎日 14:01 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refetch stale sale rows only
        env:
          DL_PRICE_START_JITTER_MAX_SEC: "300"
        run: npm run update-prices:stale

      - name: Commit and push if products.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "No changes to data/products.json — skipping commit."
            exit 0
          fi
          git commit -m "chore: refresh DLsite prices after sale end [automated]"
          git push

      - name: Upload products.json (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: products-json-stale
          path: data/products.json
